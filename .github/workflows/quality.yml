name: Quality

on:
  push:
    branches: ["**"]
  pull_request:

env:
  NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Used only for the optional `gen:types:check` step below. The app and
      # unit tests always run against the public defaults.
      API_DOCUMENT_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      # Runs only when the API base URL secret is configured. The job fails
      # when the committed generated types no longer match the live document.
      - name: Generated types are current
        if: ${{ env.API_DOCUMENT_BASE_URL != '' }}
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ env.API_DOCUMENT_BASE_URL }}
        run: pnpm gen:types:check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Boots `next dev` with NEXT_PUBLIC_ENABLE_MOCKS=true; no backend needed.
      - name: End-to-end happy path (MSW)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
